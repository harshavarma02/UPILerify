name: 💡 Feature Request
description: Propose a new feature, bank parser pattern, or enhancement for UPIlerify
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! We are constantly expanding bank regex support, framework integrations, and developer tooling.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem or limitation is.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe your proposed solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: bank-email-sample
    attributes:
      label: Sample Bank Email Format (Redacted)
      description: If requesting support for a new bank or wallet, please paste a sample credit alert email with private account numbers redacted.
      placeholder: "Your A/c ending 1234 has been credited with Rs.499.00 via UPI Ref 499012345678..."
